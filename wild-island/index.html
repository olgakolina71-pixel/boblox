<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Дикий остров — Survival</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07151a;color:#eef8ed;font:15px system-ui}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#102a2bdc;border:1px solid #7db7a366;border-radius:12px;padding:10px;backdrop-filter:blur(8px)}#stats{position:absolute;top:12px;left:12px;width:190px}#stats b{display:block;font-size:12px;margin:5px 0 2px} .bar{height:7px;background:#263c38;border-radius:8px;overflow:hidden}.fill{height:100%;width:100%;background:#8ed17d}#top{position:absolute;top:12px;right:12px;text-align:right}#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);text-align:center;max-width:90%;min-width:240px}button{pointer-events:auto;border:1px solid #b4e1bc66;border-radius:10px;background:#234a3b;color:white;padding:10px 13px;font-weight:700}#actions{position:absolute;right:14px;bottom:95px;display:flex;flex-direction:column;gap:8px}#move{position:absolute;left:18px;bottom:24px;width:120px;height:120px;border-radius:50%;border:1px solid #b4e1bc55;background:#163b3488;pointer-events:auto;touch-action:none}#nub{position:absolute;left:37px;top:37px;width:46px;height:46px;border-radius:50%;background:#b2d9aacc;pointer-events:none}#craft{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(340px,90vw);display:none;pointer-events:auto}#craft button{margin:4px}#toast{position:absolute;top:105px;left:50%;transform:translateX(-50%);font-weight:700;text-shadow:0 2px 5px #000} @media(min-width:800px){#move{display:none}#actions{bottom:24px;flex-direction:row}}
</style></head><body><div id="hud">
<div id="stats" class="panel"><strong>🏝️ ДИКИЙ ОСТРОВ</strong><b>❤️ Здоровье</b><div class="bar"><div id="hp" class="fill"></div></div><b>🍎 Сытость</b><div class="bar"><div id="food" class="fill"></div></div><b>💧 Жажда</b><div class="bar"><div id="water" class="fill"></div></div><b>🪵 Дерево: <span id="wood">0</span> · 🪨 Камень: <span id="stone">0</span></b></div>
<div id="top" class="panel"><div id="clock">☀️ День 1 · 08:00</div><div>🎒 <span id="items">Рюкзак пуст</span></div><button id="craftBtn">⚒️ Ремесло</button></div>
<div id="hint" class="panel">WASD — движение · мышь — обзор · E — собрать ресурс</div><div id="toast"></div>
<div id="actions"><button id="gather">✋ Собрать (E)</button><button id="eat">🍎 Поесть</button><button id="drink">💧 Пить</button></div>
<div id="move"><div id="nub"></div></div>
<div id="craft" class="panel"><b>⚒️ Ремесло и строительство</b><p>Создавай полезные вещи из найденных ресурсов.</p><button id="axe">🪓 Топор (3 дерева, 1 камень)</button><button id="camp">🏕️ Костёр (4 дерева, 2 камня)</button><button id="shelter">🏠 Убежище (8 дерева)</button><button id="close">Закрыть</button><p id="craftMsg"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{const scene=new THREE.Scene();scene.background=new THREE.Color(0x9cc8c4);scene.fog=new THREE.Fog(0x9cc8c4,28,95);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc8e8ff,0x49603d,2));const sun=new THREE.DirectionalLight(0xfff1ce,2.3);sun.position.set(-20,35,10);sun.castShadow=true;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.9});const ground=new THREE.Mesh(new THREE.CircleGeometry(65,80),mat(0x477b4b));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const water=new THREE.Mesh(new THREE.CircleGeometry(10,48),new THREE.MeshStandardMaterial({color:0x368eaa,roughness:.25,metalness:.1}));water.rotation.x=-Math.PI/2;water.position.set(17,.025,-13);scene.add(water);
for(let i=0;i<45;i++){let a=Math.random()*Math.PI*2,r=17+Math.random()*40,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.hypot(x-17,z+13)<12)continue;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,2.2,7),mat(0x765039));trunk.position.set(x,1.1,z);trunk.castShadow=true;scene.add(trunk);let crown=new THREE.Mesh(new THREE.ConeGeometry(1.35,3.2,7),mat(i%3?0x276443:0x39794a));crown.position.set(x,3.25,z);crown.castShadow=true;scene.add(crown)}
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.8,4,8),mat(0xe0b77c));body.position.y=.85;player.add(body);scene.add(player);player.position.set(0,0,0);
const resources=[];function resource(type,x,z){let m;if(type==='wood'){m=new THREE.Mesh(new THREE.DodecahedronGeometry(.42),mat(0x9a6944));m.position.y=.4}else{m=new THREE.Mesh(new THREE.DodecahedronGeometry(.5),mat(0x858f91));m.position.y=.45}m.position.x=x;m.position.z=z;m.castShadow=true;scene.add(m);resources.push({type,mesh:m})}
for(let i=0;i<22;i++){let a=Math.random()*6.28,r=5+Math.random()*36;resource(i%2?'stone':'wood',Math.cos(a)*r,Math.sin(a)*r)}
const inventory={wood:0,stone:0,berries:3,water:2};let hp=100,hunger=100,thirst=100,day=1,time=8,axe=false;let keys={},yaw=0,pitch=.18;const toast=document.getElementById('toast');function say(s){toast.textContent=s;clearTimeout(say.t);say.t=setTimeout(()=>toast.textContent='',2200)}
function updateUI(){document.getElementById('hp').style.width=hp+'%';document.getElementById('food').style.width=hunger+'%';document.getElementById('water').style.width=thirst+'%';document.getElementById('wood').textContent=inventory.wood;document.getElementById('stone').textContent=inventory.stone;document.getElementById('items').textContent='Ягоды: '+inventory.berries+' · Вода: '+inventory.water}
function gather(){let best=null,d=3.5;for(const o of resources){let n=o.mesh.position.distanceTo(player.position);if(n<d){d=n;best=o}}if(!best){say('Подойди ближе к дереву или камню');return}inventory[best.type]+=best.type==='wood'&&axe?2:1;scene.remove(best.mesh);resources.splice(resources.indexOf(best),1);say(best.type==='wood'?'Собрано дерево':'Собран камень');updateUI()}
function craft(kind){if(kind==='axe'&&inventory.wood>=3&&inventory.stone>=1){inventory.wood-=3;inventory.stone--;axe=true;say('Топор создан! Теперь собираешь больше дерева.')}else if(kind==='camp'&&inventory.wood>=4&&inventory.stone>=2){inventory.wood-=4;inventory.stone-=2;const f=new THREE.PointLight(0xff8a36,3,12);f.position.copy(player.position);f.position.y=1.5;scene.add(f);let fire=new THREE.Mesh(new THREE.ConeGeometry(.45,1,6),mat(0xff8a24));fire.position.copy(f.position);fire.position.y=.55;scene.add(fire);say('Костёр готов — рядом тепло!')}else if(kind==='shelter'&&inventory.wood>=8){inventory.wood-=8;const h=new THREE.Mesh(new THREE.ConeGeometry(2,2.5,4),mat(0x98714b));h.position.set(player.position.x+2,1.25,player.position.z);h.rotation.y=Math.PI/4;scene.add(h);say('Убежище построено!')}else{document.getElementById('craftMsg').textContent='Не хватает ресурсов.'}updateUI()}
document.getElementById('gather').onclick=gather;document.getElementById('eat').onclick=()=>{if(inventory.berries){inventory.berries--;hunger=Math.min(100,hunger+28);say('Ягоды восстановили сытость')}else say('Нет еды — ищи ягоды на острове');updateUI()};document.getElementById('drink').onclick=()=>{if(inventory.water){inventory.water--;thirst=Math.min(100,thirst+35);say('Ты попил воды')}else if(player.position.distanceTo(water.position)<13){thirst=100;say('Ты попил из озера')}else say('Найди озеро или запас воды');updateUI()};
document.getElementById('craftBtn').onclick=()=>document.getElementById('craft').style.display='block';document.getElementById('close').onclick=()=>document.getElementById('craft').style.display='none';document.getElementById('axe').onclick=()=>craft('axe');document.getElementById('camp').onclick=()=>craft('camp');document.getElementById('shelter').onclick=()=>craft('shelter');addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')gather()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let drag=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){drag=true;lastX=e.clientX;lastY=e.clientY}});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-lastX)*.004;pitch=Math.max(-.25,Math.min(.7,pitch+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY}});
let joy={x:0,y:0};const move=document.getElementById('move'),nub=document.getElementById('nub');move.addEventListener('pointerdown',e=>{move.setPointerCapture(e.pointerId);joyStart(e)});function joyStart(e){const r=move.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.max(1,Math.hypot(dx,dy));joy.x=dx/Math.max(1,len)*Math.min(1,len/42);joy.y=dy/Math.max(1,len)*Math.min(1,len/42);nub.style.transform='translate('+joy.x*35+'px,'+joy.y*35+'px)'}move.addEventListener('pointermove',e=>{if(e.buttons)joyStart(e)});move.addEventListener('pointerup',()=>{joy={x:0,y:0};nub.style.transform=''});
let elapsed=0;function loop(){requestAnimationFrame(loop);const forward=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0)+joy.y;const side=(keys.d||keys.arrowright?1:0)+(keys.a||keys.arrowleft?-1:0)+joy.x;const dir=new THREE.Vector3(side,0,forward);if(dir.length()>0){dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);player.position.addScaledVector(dir,.105);player.rotation.y=Math.atan2(dir.x,dir.z)}player.position.x=Math.max(-58,Math.min(58,player.position.x));player.position.z=Math.max(-58,Math.min(58,player.position.z));const target=new THREE.Vector3(player.position.x+Math.sin(yaw)*7,3.8+pitch*5,player.position.z+Math.cos(yaw)*7);camera.position.lerp(target,.12);camera.lookAt(player.position.x,1,player.position.z);
elapsed++;if(elapsed%360===0){time+=1;if(time>=24){time=0;day++}hunger=Math.max(0,hunger-1.5);thirst=Math.max(0,thirst-2);if(hunger===0||thirst===0)hp=Math.max(0,hp-2);if(hp===0){say('Ты устал. Нажми перезагрузку, чтобы начать заново.')}updateUI();document.getElementById('clock').textContent=(time>=6&&time<19?'☀️':'🌙')+' День '+day+' · '+String(time).padStart(2,'0')+':00';}
sun.position.set(Math.cos(time/24*Math.PI*2)*30,Math.max(4,Math.sin(time/24*Math.PI*2)*35),10);sun.intensity=time>=19||time<6?.35:2.3;scene.background.set(time>=19||time<6?0x14253b:0x9cc8c4);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});updateUI();
})();</script></body></html>
